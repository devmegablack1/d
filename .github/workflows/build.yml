name: Build NDS
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: find . -not -path './.git/*' -type f

      - name: Install libnds, maxmod, libfat
        run: dkp-pacman -S --noconfirm --needed nds-dev || true

      - name: Build
        shell: bash
        run: |
          set -e
          MAIN="$(find . -name main.c -not -path './.git/*' | head -1)"
          test -n "$MAIN" || { echo "main.c is missing from the repo"; exit 1; }
          cd "$(dirname "$MAIN")"
          echo "Building in: $(pwd)"

          curl -fsSL -o minimp3.h https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h

          LIBNDS="$DEVKITPRO/libnds"
          CALICO="$DEVKITPRO/calico"

          SPECS="ds_arm9.specs"
          if [ -f "$CALICO/share/ds9.specs" ]; then SPECS="$CALICO/share/ds9.specs"; fi

          # Pick the ARM7 core that contains the most maxmod (audio) code
          ARM7=""
          BEST=-1
          for name in maine ragdoll sphynx lykoi bobtail; do
            f="$CALICO/bin/ds7_$name.elf"
            [ -f "$f" ] || continue
            n=$("$DEVKITARM/bin/arm-none-eabi-nm" "$f" 2>/dev/null | grep -ci ' mm' || true)
            echo "ARM7 candidate $name: $n maxmod symbols"
            if [ "$n" -gt "$BEST" ]; then BEST=$n; ARM7="$f"; fi
          done
          if [ -z "$ARM7" ] && [ -f "$LIBNDS/default.elf" ]; then ARM7="$LIBNDS/default.elf"; fi
          if [ -z "$ARM7" ]; then
            echo "No ARM7 binary found"; ls "$CALICO/bin" || true
            exit 1
          fi
          echo "Using ARM7 core: $ARM7"

          "$DEVKITARM/bin/arm-none-eabi-gcc" -O2 -Wall -march=armv5te -mtune=arm946e-s \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -mthumb -mthumb-interwork -D__NDS__ -DARM9 \
            -I"$LIBNDS/include" -I"$CALICO/include" \
            main.c -specs="$SPECS" -mthumb -mthumb-interwork -Wl,--gc-sections \
            -L"$LIBNDS/lib" -L"$CALICO/lib" -lfat -lmm9 -lnds9 \
            -o mp3player.elf

          if [ -f icon.bmp ]; then
            "$DEVKITPRO/tools/bin/ndstool" -c mp3player.nds -9 mp3player.elf -7 "$ARM7" \
              -b icon.bmp "MP3 Player;Made by koi;"
          else
            "$DEVKITPRO/tools/bin/ndstool" -c mp3player.nds -9 mp3player.elf -7 "$ARM7"
          fi
          cp mp3player.nds "$GITHUB_WORKSPACE/mp3player.nds"
          ls -l "$GITHUB_WORKSPACE/mp3player.nds"

      - uses: actions/upload-artifact@v4
        with:
          name: mp3player-nds
          path: mp3player.nds

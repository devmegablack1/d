name: Probe WiFi support
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Look at the WiFi API and ARM7 cores
        shell: bash
        run: |
          {
            echo "=================== dswifi9.h ==================="
            cat /opt/devkitpro/libnds/include/dswifi9.h
            echo
            echo "=================== wfc.h ======================="
            cat /opt/devkitpro/libnds/include/wfc.h
            echo
            echo "=================== other net headers ==========="
            ls /opt/devkitpro/libnds/include/sys /opt/devkitpro/libnds/include/netinet /opt/devkitpro/libnds/include/arpa 2>&1 | head -40
            echo
            echo "=================== ARM7 core files ============="
            ls -l /opt/devkitpro/calico/bin/
            for f in /opt/devkitpro/calico/bin/ds7_*.elf; do
              echo "--- $f"
              arm-none-eabi-strings -a "$f" | grep -i -E 'wifi|wfc|ntrwifi|twlwifi|maxmod|mmStream|soundCmd|wlan' | head -8
            done
            echo
            echo "=================== calico notes about the cores ="
            grep -rIn -i -E 'maine|ragdoll|sphynx|lykoi|bobtail' /opt/devkitpro/calico /opt/devkitpro/libnds /opt/devkitpro/devkitARM/base_tools /opt/devkitpro/*.mk 2>/dev/null | grep -v '\.elf' | head -40
            find /opt/devkitpro -maxdepth 3 \( -name 'ds_rules' -o -name '*.mk' -o -name 'README*' -o -name '*.md' \) 2>/dev/null | head -30
            echo
            echo "=================== dswifi examples ============="
            ls -R /opt/devkitpro/examples/nds/dswifi | head -60
            for d in /opt/devkitpro/examples/nds/dswifi/*/; do
              echo "--- Makefile of $d (arm7 / lib lines)"
              grep -n -i -E 'arm7|ARM7|LIBS|ds7|NDSTOOL|-7' "$d/Makefile" | head -15
              ls "$d/arm7" 2>/dev/null
            done
            echo
            echo "=================== an example's source ========="
            for f in /opt/devkitpro/examples/nds/dswifi/*/source/*.c; do echo "##### $f"; head -120 "$f"; done 2>/dev/null | head -400
          } 2>&1 | tee probe-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe-report.txt
